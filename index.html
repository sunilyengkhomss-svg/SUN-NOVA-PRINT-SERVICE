    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      window.__SUN_NOVA_MOUNTED__ = false;
      (function () {
        var bootErr = null;
        function showBootError(reason) {
          if (window.__SUN_NOVA_MOUNTED__) return;
          var el = document.getElementById("boot-status");
          var btn = document.getElementById("boot-reload");
          if (el) {
            el.style.color = "#fda4af";
            el.textContent = reason;
          }
          if (btn) {
            btn.style.display = "inline-block";
          }
        }
        function isExtensionSource(str) {
          return (
            typeof str === "string" &&
            (str.indexOf("chrome-extension://") !== -1 ||
              str.indexOf("moz-extension://") !== -1 ||
              str.indexOf("safari-extension://") !== -1)
          );
        }
        window.addEventListener(
          "error",
          function (e) {
            var src = (e && (e.filename || (e.target && e.target.src))) || "";
            var stack = (e && e.error && e.error.stack) || "";
            var msg = (e && e.message) || "";
            if (
              isExtensionSource(src) ||
              isExtensionSource(stack) ||
              isExtensionSource(msg)
            ) {
              if (typeof e.preventDefault === "function") e.preventDefault();
              if (typeof e.stopPropagation === "function") e.stopPropagation();
              if (typeof e.stopImmediatePropagation === "function") {
                e.stopImmediatePropagation();
              }
              return true;
            }
            if (window.__SUN_NOVA_MOUNTED__) return;
            if (e && e.target && e.target.tagName === "SCRIPT") {
              var failedSrc = e.target.src || "app.js";
              if (failedSrc.indexOf("/src/main.tsx") !== -1) {
                bootErr = "Unbuilt source deployed (" + failedSrc + "). In Cloudflare Pages, set Build command to 'npm run build' and Build output directory to 'dist' (or upload the built dist/ folder instead of the root repo folder).";
                showBootError(bootErr);
              } else {
                bootErr = "Failed to load application script (" + failedSrc + "). Checking response...";
                showBootError(bootErr);
                if (typeof window.fetch === "function") {
                  window.fetch(failedSrc, { cache: "no-store" })
                    .then(function (r) {
                      var ct = (r.headers && r.headers.get("content-type")) || "unknown";
                      var extra = ct.indexOf("text/html") !== -1
                        ? " — server returned HTML fallback (asset missing from deployed ./dist/assets/)."
                        : " — check Cloudflare Deploy command ('npx wrangler deploy') or network/extension.";
                      showBootError("Failed to load application script (" + failedSrc + "): HTTP " + r.status + " (" + ct + ")" + extra);
                    })
                    .catch(function (fe) {
                      window.fetch(failedSrc, { redirect: "manual", cache: "no-store" })
                        .then(function (mr) {
                          if (mr && mr.type === "opaqueredirect") {
                            showBootError("Blocked by a cross-origin redirect on " + failedSrc + " (check Cloudflare Access / Zero Trust login rules).");
                          } else {
                            showBootError("Failed to load application script (" + failedSrc + "): " + (fe && fe.message ? fe.message : "Network blocked or aborted."));
                          }
                        })
                        .catch(function () {
                          showBootError("Failed to load application script (" + failedSrc + "): " + (fe && fe.message ? fe.message : "Failed to fetch") + " — network/ISP, firewall, or browser extension blocked the request to *.workers.dev.");
                        });
                    });
                }
              }
            } else if (e && e.message) {
              bootErr = "Startup error: " + e.message;
              showBootError(bootErr);
            }
          },
          true
        );
        window.addEventListener(
          "unhandledrejection",
          function (e) {
            var reason = e && e.reason;
            var msg = reason ? (reason.message || String(reason)) : "";
            var stack = (reason && reason.stack) || "";
            if (isExtensionSource(msg) || isExtensionSource(stack)) {
              if (typeof e.preventDefault === "function") e.preventDefault();
              if (typeof e.stopPropagation === "function") e.stopPropagation();
              if (typeof e.stopImmediatePropagation === "function") {
                e.stopImmediatePropagation();
              }
              return;
            }
            if (window.__SUN_NOVA_MOUNTED__) return;
            if (msg) {
              bootErr = "Startup error: " + msg;
              showBootError(bootErr);
            }
          },
          true
        );
        setTimeout(function () {
          if (!window.__SUN_NOVA_MOUNTED__ && !bootErr) {
            showBootError("Studio is still loading or blocked by browser cache/extension. Try Reload or open in a fresh Incognito window.");
          }
        }, 12000);
      })();
    </script>

  <body class="bg-[#080B12] text-[#F5F7FA]">

        <div style="max-width:440px;">
          <div style="font-weight:800;font-size:18px;letter-spacing:0.04em;color:#00E5FF;">SUN-NOVA PRINT SERVICE</div>
          <div id="boot-status" style="margin-top:8px;font-size:13px;color:#94A3B8;line-height:1.5;">Initializing Futuristic Print Studio...</div>
          <button id="boot-reload" type="button" onclick="window.location.reload()" style="display:none;margin-top:14px;padding:8px 16px;font-size:12px;font-weight:600;color:#080B12;background:#00E5FF;border:none;border-radius:8px;cursor:pointer;">Reload Page</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
