name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Sync D1/R2 & Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare API credentials
        id: cf-auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets to enable GitHub Actions auto-deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22
        if: steps.cf-auth.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.cf-auth.outputs.configured == 'true'
        run: npm ci

      - name: Resolve D1 & R2 bindings and apply migrations
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: npm run cf:ci-resolve

      - name: Build lightweight SPA & sync wrangler.jsonc bindings
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          BUNDLE_ORT_WASM: ${{ vars.BUNDLE_ORT_WASM }}
        run: npm run build

      - name: Validate Wrangler config, Worker ESM & 25 MiB asset caps
        if: steps.cf-auth.outputs.configured == 'true'
        run: npm run cf:validate

      - name: Sync Worker runtime secrets
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: npm run cf:sync-secrets -- --warn-only

      - name: Deploy Worker via Wrangler
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
