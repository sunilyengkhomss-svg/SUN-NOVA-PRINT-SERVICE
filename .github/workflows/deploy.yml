name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, Sync D1/R2 & Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (echo "::warning::Lockfile out of sync, falling back to npm install" && npm install --no-audit --no-fund)

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Check Cloudflare API credentials
        id: cf-auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets to deploy automatically via GitHub Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify lightweight build & bundle (without deploy secrets)
        if: steps.cf-auth.outputs.configured != 'true'
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          BUNDLE_ORT_WASM: ${{ vars.BUNDLE_ORT_WASM }}
        run: |
          npm run build
          npm run cf:validate

      - name: Resolve D1 & R2 bindings and apply remote migrations
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: npm run cf:ci-resolve

      - name: Build lightweight SPA & inject Wrangler bindings
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          BUNDLE_ORT_WASM: ${{ vars.BUNDLE_ORT_WASM }}
        run: npm run build

      - name: Validate Wrangler config, Worker ESM & 25 MiB asset caps
        if: steps.cf-auth.outputs.configured == 'true'
        run: npm run cf:validate

      - name: Sync Worker runtime secrets
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: npm run cf:sync-secrets -- --warn-only

      - name: Deploy Worker via Wrangler
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Disconnect legacy Cloudflare Workers Builds trigger (if permitted)
        if: steps.cf-auth.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-workers-builds.mjs --disconnect --warn-only

      - name: Publish deployment summary
        if: always()
        env:
          CF_CONFIGURED: ${{ steps.cf-auth.outputs.configured }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## SUN-NOVA PRINT SERVICE — Cloudflare Workers CI"
            echo ""
            if [ "$CF_CONFIGURED" = "true" ]; then
              echo "| Check | Status / Value |"
              echo "| :--- | :--- |"
              echo "| **Workflow Status** | \`${JOB_STATUS}\` |"
              echo "| **D1 Database (\`DB\`)** | \`${D1_DATABASE_NAME:-sun-nova-db}\` |"
              echo "| **R2 Media (\`MEDIA_BUCKET\`)** | \`${R2_STATUS:-d1-blob-fallback}\` |"
              echo "| **Legacy CF Workers Builds** | \`${LEGACY_CF_BUILDS_STATUS:-manual-check-required}\` |"
              echo ""
              echo "> **Note:** If Cloudflare Dashboard still shows \`Latest build failed (Deploy command: dist)\` on your commits, open **Cloudflare Dashboard → Compute (Workers & Pages) → sun-nova-print-service → Settings → Builds** and click **Disconnect**. GitHub Actions is now your active deployer."
            else
              echo "- **Build & Typecheck:** Passed (\`npm run lint\`, \`npm run build\`, \`npm run cf:validate\`)"
              echo "- **Cloudflare Deploy:** Skipped (waiting for GitHub Secrets)"
              echo ""
              echo "### Next Steps to Activate Auto-Deploy"
              echo "1. In Cloudflare Dashboard -> **Workers & Pages -> sun-nova-print-service -> Settings -> Builds**, click **Disconnect** so Cloudflare stops running the failing \`Deploy command: dist\` trigger."
              echo "2. In this GitHub repository -> **Settings -> Secrets and variables -> Actions -> Repository secrets**, add:"
              echo "   - \`CLOUDFLARE_API_TOKEN\` (Permissions: \`Workers Scripts: Edit\`, \`D1: Edit\`, \`Workers R2 Storage: Edit\`, \`Account Settings: Read\`)"
              echo "   - \`CLOUDFLARE_ACCOUNT_ID\`"
              echo "   - Optional runtime secrets: \`ADMIN_SETUP_TOKEN\`, \`RESEND_API_KEY\`, \`GEMINI_API_KEY\`"
              echo "3. Re-run this workflow via **Actions -> Deploy to Cloudflare Workers -> Run workflow**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
